name: Code Review by GPT

on:
  pull_request:
    branches: [ main ]

permissions: write-all

jobs:
  code_review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start g4f
        run: |
          docker run -d --rm --name g4f-proxy -p 8080:8080 hlohaus789/g4f
          echo "Waiting for g4f to be available..."
          for i in {1..10}; do
            if curl -s http://localhost:8080/v1/models | grep -q "gpt"; then
              echo "g4f is ready!"
              exit 0
            fi
            echo "Retrying in 3 seconds..."
            sleep 3
          done
          echo "g4f did not start in time!"
          exit 1

      - name: Run Code Review
        uses: mattzcarey/code-review-gpt@v0.8.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: "dummy-key"
          OPENAI_BASE_URL: "http://localhost:8080/v1"
          MODEL: "gpt-4o-mini"
          REVIEW_LANGUAGE: "English"

      - name: Show g4f logs
        run: docker logs g4f-proxy

      - name: Stop g4f
        if: always()
        run: docker stop g4f-proxy || true
